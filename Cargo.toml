[workspace]
resolver = "2"
members = [
    # Domain (pure, portable — no Tauri/UI).
    "crates/core",
    "crates/store",
    "crates/crdt",
    "crates/srs",
    # Domain stubs (not yet wired).
    "crates/ai",
    "crates/search",
    "crates/sync-client",
    # Facade + shells.
    "crates/app-core",
    "apps/desktop/src-tauri",
    # Sync server (source-available, ADR-009).
    "server/sync-server",
]

# Shared metadata inherited by member crates via `*.workspace = true`.
[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/leal32b/noderium"
authors = ["Noderium contributors"]

[workspace.dependencies]
# Third-party versions are centralized here; member crates opt in with
# `<dep>.workspace = true` so versions can never drift across the workspace.
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
loro = "1.13"
rs-fsrs = "1.2"
chrono = "0.4"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
