name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      # Desktop crate is excluded here — it embeds the frontend dist via
      # generate_context!; it is compiled in the `desktop` job below.
      - name: Clippy
        run: cargo clippy --workspace --exclude noderium-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude noderium-desktop

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @noderium/desktop-frontend run typecheck
      - name: Lint
        run: pnpm --filter @noderium/desktop-frontend run lint
      - name: Format check
        run: pnpm --filter @noderium/desktop-frontend run format:check
      - name: Test
        run: pnpm --filter @noderium/desktop-frontend run test
      - name: Build
        run: pnpm --filter @noderium/desktop-frontend run build

  perf-budget:
    name: Perf budget — editor latency (Spike #1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fails the build if p95 keystroke latency > 16ms (ADR-004).
      - name: Editor latency test
        run: pnpm --filter @noderium/editor test

  desktop:
    name: Desktop (Tauri build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libappindicator3-dev patchelf build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Build the frontend dist first — Tauri's generate_context! embeds it.
      - name: Build frontend
        run: pnpm --filter @noderium/desktop-frontend build
      - name: Build Tauri app
        run: cargo build -p noderium-desktop
