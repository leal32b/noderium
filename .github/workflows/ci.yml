# CI stub (Phase 1). Real perf-budget jobs (cold start, typing latency) added later.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  frontend:
    name: Frontend (lint, test) — placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Frontend CI wired in Phase 2 (eslint, vitest, format:check)."
