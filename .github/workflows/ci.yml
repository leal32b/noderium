name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @noderium/desktop-frontend run typecheck
      - name: Lint
        run: pnpm --filter @noderium/desktop-frontend run lint
      - name: Format check
        run: pnpm --filter @noderium/desktop-frontend run format:check
      - name: Test
        run: pnpm --filter @noderium/desktop-frontend run test
      - name: Build
        run: pnpm --filter @noderium/desktop-frontend run build

  perf-budget:
    name: Perf budget — editor latency (Spike #1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fails the build if p95 keystroke latency > 16ms (ADR-004).
      - name: Editor latency test
        run: pnpm --filter @noderium/editor test
