# Deploy the docs site to GitHub Pages at https://leal32b.github.io/noderium.
#
# `site`/`base` (/noderium) are set in docs/astro.config.mjs, and a rehype plugin
# prefixes the base onto content links, so the subpath deploy resolves.
#
# Auto-deploys on a push to `main` that touches docs (e.g. a merged PR), and can
# also be run manually. Requires Pages to be enabled first, or the deploy step
# fails: Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Docs deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: pnpm --filter @noderium/docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
