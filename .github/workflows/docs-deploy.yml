# Deploy the docs site to GitHub Pages.
#
# STUB: this is wired up but intentionally manual-only (workflow_dispatch) so it
# never runs unexpectedly. To enable it:
#   1. Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Decide the URL:
#      - Custom domain or a user/org page  → deploys at the root, no extra config.
#      - Project path (leal32b.github.io/noderium) → set `site` and `base` in
#        docs/astro.config.mjs (base: '/noderium') so assets resolve, and prefix
#        internal links with the base. Internal links are currently authored
#        base-free for a root deploy.
#   3. Run this workflow from the Actions tab (or change the trigger to `push`).
name: Docs deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: pnpm --filter @noderium/docs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
