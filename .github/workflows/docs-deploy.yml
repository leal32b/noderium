# Deploy the docs site to GitHub Pages at https://leal32b.github.io/noderium.
#
# `site`/`base` (/noderium) are set in docs/astro.config.mjs, and a rehype plugin
# prefixes the base onto content links, so the subpath deploy resolves. Kept
# manual-only (workflow_dispatch) until Pages is enabled, so it never fails
# unexpectedly. To go live:
#   1. Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Run this workflow from the Actions tab.
# To auto-deploy on every docs change, add to the trigger below:
#   push: { branches: [main], paths: ['docs/**', '.github/workflows/docs-deploy.yml'] }
name: Docs deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: pnpm --filter @noderium/docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
