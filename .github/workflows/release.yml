name: Release (build installers)

# Reusable build: produces the Tauri desktop installers for macOS (universal),
# Linux and Windows and uploads them to the GitHub Release for `tag`. Called by
# release-please.yml after it cuts a release; also runnable manually to (re)build
# installers for an existing tag. The frontend dist is produced by the configured
# beforeBuildCommand (tauri.conf.json), so no extra build step is needed.
on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag of the release to build (e.g. v0.1.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag of the release to build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & upload (${{ matrix.platform }})
    permissions:
      contents: write # upload installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Install Tauri system deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libappindicator3-dev patchelf build-essential

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Optional code signing (define these repo secrets to enable) ---
          # macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #          APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          # Windows: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
        with:
          projectPath: apps/desktop
          # Upload to the release release-please already created for this tag
          # (don't pass releaseName/Body, so its changelog notes are kept).
          tagName: ${{ inputs.tag }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
