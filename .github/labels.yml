# Repository labels, synced by .github/workflows/labels.yml.
# These back the labels referenced by the issue templates so they actually apply.

# --- type ---
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type: feature"
  color: "0e8a16"
  description: "A defined feature to implement"
- name: "type: feature-request"
  color: "1d76db"
  description: "A community-suggested feature"
- name: "type: chore"
  color: "fef2c0"
  description: "Maintenance, tooling, dependencies"
- name: "type: spike"
  color: "5319e7"
  description: "Time-boxed technical investigation"
- name: "type: refactoring"
  color: "fbca04"
  description: "Code change that neither fixes a bug nor adds a feature"
- name: "type: documentation"
  color: "0075ca"
  description: "Documentation changes"

# --- status ---
- name: "status: triage"
  color: "ededed"
  description: "Needs initial review/triage"
- name: "status: ready"
  color: "0e8a16"
  description: "Specified and ready to be worked on"
- name: "status: in-progress"
  color: "fbca04"
  description: "Actively being worked on"
- name: "status: blocked"
  color: "b60205"
  description: "Blocked by another issue or decision"
- name: "status: done"
  color: "c2e0c6"
  description: "Completed"
